name: Landing checks
on:
  push:
    branches: [feat/seo-landing-pages-v2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: source/go.sum
      - run: go test ./...
        working-directory: source
      - run: node --test tests/*.test.cjs
