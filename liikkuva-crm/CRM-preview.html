x;padding:15px 20px;max-width:450px;z-index:10;display:none}.demo{background:#ffedcf;padding:9px 20px;text-align:center;color:#6b4d23;font-size:12px}.amount{font-size:22px;font-weight:650}.section-note{font-size:12px;line-height:1.7;color:var(--muted)}.back{font-size:12px;margin-bottom:20px}.login small{display:block;margin-top:18px;line-height:1.6}a.button{display:inline-block;padding:10px 15px;border:1px solid var(--line);border-radius:9px;text-decoration:none;font-weight:600;font-size:13px}@media(min-width:1500px){main{padding:42px 50px}.grid{grid-template-columns:1fr 350px}.stats{gap:22px}}@media(max-width:1150px){.shell{grid-template-columns:190px 1fr}.sidebar{padding:28px 12px}main{padding:26px 24px}.topbar{padding:0 24px}.grid{grid-template-columns:1fr}.aside{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stats{gap:10px}.stat{padding:15px}.detailgrid{grid-template-columns:1fr}}@media(max-width:720px){.shell{display:block}.sidebar{position:relative;height:auto;padding:17px 18px}.logo{font-size:25px;margin-left:0}.sublogo{margin-left:0}.nav{margin:20px 0 0;display:flex;gap:5px;overflow:auto}.nav button{white-space:nowrap;padding:10px;font-size:12px}.nav b,.sidefoot,.sidebar .user{display:none}.topbar{height:67px;padding:12px 18px}.topbar input{max-width:none}.topbar .right .date{display:none}main{padding:24px 16px}h1{font-size:26px}.heading{align-items:flex-start}.heading button{padding:10px;font-size:12px}.stats{grid-template-columns:1fr 1fr}.stat .value{font-size:28px}.panel{padding:18px 15px}.aside{display:block}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.facts{gap:16px}.calendarRow{grid-template-columns:78px 1fr}.calendarRow>.badge{display:none}.photos{grid-template-columns:1fr 1fr}dialog{padding:24px 20px}.login{margin:8vh 16px}.topbar .right{gap:6px}.desktop{display:none}}
</style></head><body><div id="app"><div class="loading">Liikkuva · Загрузка рабочего пространства…</div></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><script>'use strict';
const uuid=()=>Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={new:'Новая заявка',assigned:'У механика',proposed:'Ждём клиента',client_confirmed:'Нужно подтвердить',scheduled:'Выезд назначен',in_progress:'В работе',review:'Проверить отчёт',closed:'Закрыта',cancelled:'Отменена'};
const actions={created:'Заявка создана',assign:'Назначен механик',propose:'Предложены время и стоимость',client_confirm:'Записано согласие клиента',confirm:'Выезд подтверждён',reschedule:'Запрошен перенос',start:'Начаты работы',report:'Отчёт механика',close:'Обращение закрыто',reopen:'Возвращено в работу',cancel:'Заявка отменена',message:'Сообщение',vehicle:'Данные автомобиля',photo:'Добавлено фото'};
const euro=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'EUR'}).format((n||0)/100);
const fmt=(d,full=true)=>d&&new Date(d).getFullYear()>2000?new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Helsinki',day:'2-digit',month:'2-digit',...(full?{hour:'2-digit',minute:'2-digit'}:{})}).format(new Date(d)):'—';
const hh=d=>new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Helsinki',hour:'2-digit',minute:'2-digit'}).format(new Date(d));
const day=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d));
const badge=j=>`<span class="badge ${esc(j.status)}">${labels[j.status]||esc(j.status)}</span>`;
let me=null,jobs=[],users=[],view='overview',filter='all',selected=null,cursor='',query='',notices=[],pendingKey=uuid();
const demo=true;
const manager=()=>me&&['owner','manager'].includes(me.role);
const userName=id=>users.find(u=>u.id===id)?.name||(id===me?.id?me.name:'Механик');
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',5500)}
async function api(path,method='GET',body,headers={}){
 const opts={method,headers:{'X-CRM-Request':'1',...headers},credentials:'same-origin'};
 if(body instanceof FormData) opts.body=body;else if(body!==undefined){opts.body=JSON.stringify(body);opts.headers['Content-Type']='application/json'}
 const r=await fetch('/crm/api/'+path,opts);const d=await r.json();if(!r.ok){if(r.status===401&&path!=='login'){me=null;login()};throw Error(d.error||'Ошибка запроса')};return d;
}
function login(){ $('#app').innerHTML=`<form class="login" id="login"><div class="logo">liikkuva<i>↗</i></div><h2>Вход в CRM</h2><p class="muted">Автомобили, команда и каждый выезд — в одном месте.</p><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><div class="error" id="loginerror"></div><button class="primary">Войти</button><small>Доступ выдаёт владелец. Для механика доступна информация по назначенным ему обращениям.</small></form>`;
 $('#login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{me=await api('login','POST',Object.fromEntries(new FormData(e.target)));await load();}catch(x){$('#loginerror').textContent=x.message}finally{b.disabled=false}};
}
async function load(more=false){if(!demo){const result=await api('jobs?'+new URLSearchParams({...(query?{plate:query}:{}),...(more&&cursor?{cursor}: {})}));jobs=more?[...jobs,...result.jobs]:result.jobs;cursor=result.cursor;if(manager())users=await api('users');}render();}
function shell(inner){const nav=[['overview','◫','Обзор'],['jobs','▤','Обращения'],['vehicles','▱','Автомобили'],['calendar','▦','Календарь'],...(manager()?[['team','♧','Команда'],['notifications','◉','Уведомления']]:[])];
 $('#app').innerHTML=`${demo?'<div class="demo">Демонстрация интерфейса • вымышленные данные • изменения не отправляются на сервер</div>':''}<div class="shell"><aside class="sidebar"><div class="logo">liikkuva<i>↗</i></div><div class="sublogo">РАБОЧЕЕ ПРОСТРАНСТВО</div><nav class="nav">${nav.map(([id,icon,title])=>`<button data-view="${id}" class="${view===id?'active':''}"><b>${icon}</b>${title}</button>`).join('')}</nav><div class="sidefoot">Детали имеют значение.<br>Вся история — под рукой.</div><div class="user"><span class="avatar">${esc(me.name[0])}</span><div>${esc(me.name)}<br><small>${manager()?'Управление CRM':'Механик'}</small></div></div></aside><div class="content"><header class="topbar"><form id="search"><input aria-label="Поиск по номеру автомобиля" name="plate" placeholder="Поиск по номеру автомобиля…" value="${esc(query)}"></form><div class="right"><span class="date">${new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Helsinki',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</span><button id="logout">Выйти</button></div></header><main>${inner}</main></div></div>`;
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=async()=>{view=b.dataset.view;selected=null;filter='all';try{if(view==='notifications'&&!demo)notices=await api('notifications');await load()}catch(e){toast(e.message)}});
 $('#search').onsubmit=async e=>{e.preventDefault();query=new FormData(e.target).get('plate').trim();view='jobs';selected=null;try{await load()}catch(e){toast(e.message)}};
 $('#logout').onclick=async()=>{if(demo){location.href='/crm/';return}try{await api('logout','POST',{});login()}catch(e){toast(e.message)}};
 document.querySelectorAll('[data-job]').forEach(el=>el.onclick=()=>openJob(el.dataset.job));
 document.querySelectorAll('[data-plate]').forEach(el=>el.onclick=async()=>{query=el.dataset.plate;view='jobs';await load()});
 $('#create')?.addEventListener('click',createJob);$('#more')?.addEventListener('click',async()=>{try{await load(true)}catch(e){toast(e.message)}});
}
function rows(list){return `<div class="tablewrap"><table><thead><tr><th>Автомобиль / клиент</th><th>Обращение</th><th>Механик</th><th>Статус</th><th>Стоимость</th></tr></thead><tbody>${list.map(j=>`<tr data-job="${j.id}"><td><span class="plate">${esc(j.plate)}</span><span class="subline">${esc(j.name)}</span></td><td>${esc(j.description.slice(0,58))}<span class="subline">${fmt(j.created)} · <span class="brand">${esc(j.brand)}</span></span></td><td>${j.mechanic?esc(userName(j.mechanic)):'Не назначен'}<span class="subline">${fmt(j.proposal.start)}</span></td><td>${badge(j)}</td><td>${['new','assigned'].includes(j.status)?'Не согласована':euro(j.proposal.visit_cents+j.proposal.work_cents+j.proposal.parts_cents)}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">Пока нет обращений.<br>Создайте заявку или измените поиск.</div>':''}</div>`}
const heading=(title,sub,button='')=>`<div class="heading"><div><div class="eyebrow">${manager()?'Центр управления':'Мой рабочий день'}</div><h1>${title}</h1><p class="muted">${sub}</p></div>${button}</div>`;
function render(){if(selected){detail();return};let body='';const create=manager()?'<button id="create" class="primary">＋ Новое обращение</button>':'';const active=jobs.filter(j=>!['closed','cancelled'].includes(j.status));const today=jobs.filter(j=>['scheduled','in_progress'].includes(j.status)&&day(j.proposal.start)===day(new Date())).sort((a,b)=>new Date(a.proposal.start)-new Date(b.proposal.start));
 if(view==='overview'){
 const awaiting=jobs.filter(j=>['client_confirmed','review','new'].includes(j.status));
 body=heading('Всё готово к рабочему дню','Заявки, выезды и решения, которые ждут вашего внимания.',create)+`<div class="stats"><div class="stat"><span>Активных обращений</span><div class="value">${active.length}</div><small>От заявки до завершения</small></div><div class="stat emphasis"><span>Выезды сегодня</span><div class="value">${today.length}</div><small>Время Хельсинки · подтверждённые</small></div><div class="stat"><span>Требуют внимания</span><div class="value">${awaiting.length}</div><small>Новые, согласования, отчёты</small></div><div class="stat"><span>Получено по отчётам</span><div class="value">${euro(jobs.reduce((n,j)=>n+j.report.received_cents,0))}</div><small>По загруженным обращениям</small></div></div><div class="grid"><section><div class="panel"><div class="panelhead"><h2>В работе и на согласовании</h2><span class="badge">${active.length} обращений</span></div>${rows(active.slice(0,8))}</div><p class="section-note">${cursor?'Показана часть базы. Откройте «Обращения» и загрузите остальные записи.':'Данные обновляются при открытии раздела или поиске.'}</p></section><aside class="aside"><div class="panel"><div class="panelhead"><h2>Сегодня</h2><span class="badge">${fmt(new Date(),false)}</span></div>${today.map(j=>`<div class="timelineitem" data-job="${j.id}"><div class="time">${hh(j.proposal.start)}</div><div class="body"><h3>${esc(j.plate)} · ${esc(userName(j.mechanic))}</h3><p>${esc(j.address)}</p>${badge(j)}</div></div>`).join('')||'<div class="empty">На сегодня выездов нет</div>'}</div><div class="callout"><h3>Сначала согласование.<br>Потом — выезд.</h3>В календарь попадают только выезды, которые вы подтвердили после согласия клиента. Предложение механика ещё не является записью.</div></aside></div>`;
 }else if(view==='jobs'){
 const list=jobs.filter(j=>(filter==='all'||j.status===filter)&&(!demo||!query||j.plate.replace('-','').includes(query.toUpperCase().replace('-',''))));body=heading(query?'История '+esc(query):'Обращения','Каждый визит — отдельная запись с датами, стоимостью и результатом.',create)+`<div class="toolbar">${[['all','Все'],...Object.entries(labels)].map(([k,v])=>`<button data-filter="${k}" class="${filter===k?'active':''}">${v}</button>`).join('')}</div><div class="panel">${rows(list)}</div>${cursor?'<button id="more">Загрузить следующие 100</button>':''}`;
 }else if(view==='vehicles'){

// Explicit Helsinki conversion; reject nonexistent spring DST times. Ambiguous autumn hour requires a UTC offset.
function helsinkiISO(value){if(!value)throw Error('Укажите дату и время');const [date,time]=value.split('T');const [y,m,d]=date.split('-').map(Number),[h,min]=time.split(':').map(Number);const nominal=Date.UTC(y,m-1,d,h,min);const matches=[2,3].map(offset=>new Date(nominal-offset*3600000)).filter(x=>localInput(x)===value);if(matches.length!==1)throw Error('Это время попадает на перевод часов. Выберите другое время вне повторяющегося / пропущенного часа.');return matches[0].toISOString()}

async function vehicleHistory(j){try{let result=demo?{visits:jobs.filter(x=>x.plate===j.plate),cursor:''}:await api('jobs/'+j.id+'/vehicle-history');let visits=result.visits;
 const draw=()=>{const d=$('#modal');d.innerHTML=`<h2>Техническая история ${esc(j.plate)}</h2><p class="section-note">Предыдущие работы и фото по этому автомобилю. Контакты прошлых клиентов здесь не отображаются.</p>${visits.sort((a,b)=>new Date(b.created)-new Date(a.created)).map(v=>`<div class="panel"><strong>${fmt(v.created)} · ${labels[v.status]}</strong><p>${esc(v.description)}</p><p>${esc(v.report.work||v.proposal.plan||'Отчёт ещё не заполнен')}</p>${v.report.remaining?`<p><strong>Осталось:</strong> ${esc(v.report.remaining)}</p>`:''}<p class="section-note">Пробег: ${v.mileage||'—'} км · Получено: ${euro(v.report.received_cents)}</p><div class="photos">${(v.photos||[]).map(p=>`<a href="/crm/api/jobs/${j.id}/vehicle-photos/${v.id}/${p.id}" target="_blank" rel="noopener"><img src="/crm/api/jobs/${j.id}/vehicle-photos/${v.id}/${p.id}" alt="${esc(p.caption||'История ремонта')}" loading="lazy"></a>`).join('')}</div></div>`).join('')}${result.cursor?'<button id="moreVehicle">Загрузить ещё</button>':''}<button id="closeHistory">Закрыть</button>`;if(!d.open)d.showModal();$('#closeHistory').onclick=()=>d.close();$('#moreVehicle')?.addEventListener('click',async()=>{try{result=await api('jobs/'+j.id+'/vehicle-history?cursor='+result.cursor);visits.push(...result.visits);draw()}catch(e){toast(e.message)}})};draw()}catch(e){toast(e.message)}}

(async()=>{if(demo){seed();render();return}try{me=await api('me');await load();const id=new URLSearchParams(location.search).get('job');if(id)await openJob(id)}catch(e){if(!me)login();else toast(e.message)}})();
